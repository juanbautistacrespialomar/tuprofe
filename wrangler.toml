# ============================================================
#  Config de Cloudflare para el Worker (la API) + la base D1
# ============================================================
name = "tuprofe-api"
main = "worker/index.js"
compatibility_date = "2026-01-01"

# --- Base de datos D1 ---
# Después de crear la base con:
#     npx wrangler d1 create tuprofe-db
# Cloudflare te devuelve un database_id: pegalo acá abajo.
[[d1_databases]]
binding = "DB"                       # así se llama dentro del Worker: env.DB
database_name = "tuprofe-db"
database_id = "a22c0b4b-eca8-42ac-9638-1a51537948f8"

# No hace falta ningún secret: las sesiones usan tokens aleatorios
# guardados en la base, y las contraseñas se hashean con PBKDF2 (nativo).
